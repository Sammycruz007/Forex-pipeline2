project:
  name: trading-signal-pipeline
  version: "1.0.0"

data:
  symbol: "EURUSD=X"
  interval: "1d"
  start_date: "2018-01-01"
  end_date: "2026-05-20"
  raw_path: "data/raw"
  features_path: "data/features"
  macro_symbols:
    - "DX-Y.NYB"      # USD Dollar Index
    - "^TNX"          # US 10Y Treasury Yield (interest rate signal)
    - "GC=F"          # Gold (risk-off signal)

features:
  target_horizon: 2.
  target_column: "direction"
  price_column: "Close"

model:
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  model_path: "models"
  experiment_name: "trading-signal"

  lightgbm:
    n_trials: 100
    timeout: 600

thresholds:
  min_directional_accuracy: 0.52
  min_f1_score: 0.48

api:
  host: "0.0.0.0"
  port: 8000

mlflow:
  tracking_uri: "mlruns"
