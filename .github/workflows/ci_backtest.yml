name: CI — Backtest Gate

# Triggers: runs on every push and every pull request
# This means no code reaches main without passing
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ── 1. Checkout code ────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ── 3. Install dependencies ─────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.2.0 pytest-cov==5.0.0 httpx==0.27.0

      # ── 4. Download fresh data ──────────────────────────
      - name: Download market data
        run: |
          python src/ingestion.py
        env:
          PYTHONPATH: .

      # ── 5. Build feature store ──────────────────────────
      - name: Build feature store
        run: |
          python src/features.py
        env:
          PYTHONPATH: .

      # ── 6. Run unit + data quality tests ────────────────
      #    Fast tests first — fail early if basic logic is broken
      - name: Run unit and data quality tests
        run: |
          pytest tests/test_data_quality.py tests/test_features.py \
            -v --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=60
        env:
          PYTHONPATH: .

      # ── 7. Train model ───────────────────────────────────
      - name: Train model
        run: |
          python src/train.py
        env:
          PYTHONPATH: .

      # ── 8. Run integration tests ─────────────────────────
      #    Needs trained model — runs after training
      - name: Run integration tests
        run: |
          pytest tests/test_integration.py \
            -v --tb=short
        env:
          PYTHONPATH: .

      # ── 9. Run backtest quality gate ─────────────────────
      #    This is the MLOps centrepiece.
      #    Exit code 0 = pass, exit code 1 = fail + block merge
      - name: Run backtest quality gate
        run: |
          python src/evaluate.py
        env:
          PYTHONPATH: .

      # ── 10. Upload test coverage report ──────────────────
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()   # upload even if tests fail
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

      # ── 11. Upload model artifacts ────────────────────────
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        if: success()   # only if everything passed
        with:
          name: trained-model
          path: models/
          retention-days: 7
