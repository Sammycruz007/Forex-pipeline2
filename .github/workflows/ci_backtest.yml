name: CI — Backtest Gate

on:
  schedule:
    - cron: "0 18 * * 0"  # Every Sunday 6PM UTC — signal ready before Monday open
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.2.0 httpx==0.27.0
          pip install xgboost==2.0.3 catboost==1.2.5

      - name: Download market data
        run: python src/ingestion.py
        env:
          PYTHONPATH: .

      - name: Build feature store
        run: python src/features.py
        env:
          PYTHONPATH: .

      - name: Run unit and data quality tests
        run: pytest tests/test_data_quality.py tests/test_features.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Train model
        run: python src/train.py
        env:
          PYTHONPATH: .

      - name: Run integration tests
        run: pytest tests/test_integration.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Run backtest quality gate
        run: python src/evaluate.py
        env:
          PYTHONPATH: .

      - name: Wake up Render API
        run: |
          curl -s https://forex-signal-api-28dg.onrender.com/health || true
          echo "API pinged"

      - name: Commit trained model back to repo
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git diff --staged --quiet || git commit -m "chore: auto-update production model [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
