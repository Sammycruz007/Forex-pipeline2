name: CI — Refresh Data & Signal (No Retrain)

on:
  schedule:
    - cron: "30 22 * * 1-5" # Weekdays, 11:30PM UTC — after forex close (~22:00 UTC / 5PM NY)
  workflow_dispatch: {}     # allows manual trigger from the Actions tab

jobs:
  refresh-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install xgboost==2.0.3

      - name: Download market data
        run: python src/ingestion.py
        env:
          PYTHONPATH: .

      - name: Build feature store
        run: python src/features.py
        env:
          PYTHONPATH: .

      - name: Generate and lock signal
        run: python -c "from src.predict import generate_signal; from src.signal_store import save_weekly_signal; save_weekly_signal(generate_signal())"
        env:
          PYTHONPATH: .

      - name: Wake up Render API
        run: |
          curl -s https://forex-signal-api-28dg.onrender.com/health || true
          echo "API pinged"

      - name: Commit refreshed data back to repo
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -f data/ models/weekly_signal.json
          git diff --staged --quiet || git commit -m "chore: refresh data + signal [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
